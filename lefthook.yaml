---
templates:
  run_python: 'uv run'

pre-commit:
  parallel: true
  jobs:
    - name: 'EditorConfig'
      glob: '*.*'
      run: 'ec -disable-indent-size {staged_files}'
    - name: 'Nim'
      glob: '*.nim'
      run: 'nph {staged_files}'
      stage_fixed: true
    - name: 'YAML'
      glob: '*.yaml'
      run: 'ryl {staged_files}'
      stage_fixed: true
    - name: 'GitHub Actions'
      glob: '.github/workflows/*.yaml'
      run: 'actionlint {staged_files}'
      stage_fixed: true
    - name: 'reStructuredText'
      glob: '*.rst'
      group:
        parallel: true
        jobs:
          - name: 'syntax-check'
            run: '{run_python} doc8 {staged_files}'
